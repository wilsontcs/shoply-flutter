name: shoply_flutter
description: "A Flutter product catalogue with offline recovery, search, and a persistent wishlist."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  provider: ^6.1.5+1
  dio: ^5.11.1
  shared_preferences: ^2.5.6
  go_router: ^18.1.4
  cached_network_image: ^4.0.3
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  json_serializable: ^6.15.2
  build_runner: ^2.15.1

flutter:

  uses-material-design: true
